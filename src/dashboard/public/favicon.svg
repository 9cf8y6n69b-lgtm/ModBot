<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Background with deep contrast -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>

    <!-- Vibrant Emblem Gradient -->
    <linearGradient id="fav-emblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Electric Cyan Core -->
    <linearGradient id="fav-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base with 1px border -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#fav-bg)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>

  <!-- Left Pillar & Diagonal of M -->
  <path d="M 6.5 8.5 C 6.5 7.7 7.1 7 8 7 L 11.5 7 C 12.3 7 13 7.5 13.4 8.2 L 16 13 L 13.5 18 L 9.5 11 L 9.5 23.5 C 9.5 24.3 8.8 25 8 25 C 7.2 25 6.5 24.3 6.5 23.5 Z" 
        fill="url(#fav-emblem)"/>

  <!-- Right Pillar & Diagonal of M -->
  <path d="M 25.5 8.5 C 25.5 7.7 24.9 7 24 7 L 20.5 7 C 19.7 7 19 7.5 18.6 8.2 L 16 13 L 18.5 18 L 22.5 11 L 22.5 23.5 C 22.5 24.3 23.2 25 24 25 C 24.8 25 25.5 24.3 25.5 23.5 Z" 
        fill="#7983F5"/>

  <!-- Lower Shield Tip -->
  <path d="M 13.5 20.5 L 16 25 L 18.5 20.5 L 16 22 Z" 
        fill="#5865F2"/>

  <!-- Glowing Sentinel Core Diamond -->
  <polygon points="16,6.5 19,11.5 16,15.5 13,11.5" fill="url(#fav-cyan)"/>
  <circle cx="16" cy="11.5" r="1.1" fill="#ffffff"/>
</svg>
